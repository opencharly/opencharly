# The umbrella root project — a view over the org's submodules. It declares the
# check-bed ROSTER (which disposable beds run together as one gate), reached via the
# local-path import below, AND the maintenance TASK surface (`charly task <name>`).
# The beds themselves live in the submodules (charly/, distro-*).
repo: github.com/opencharly/opencharly
import:
    # The charly submodule, by LOCAL PATH. Its own entities (the main repo's
    # disposable beds + vm templates) and its OWN @github imports (the distro
    # namespaces: arch/cachyos/debian/fedora/ubuntu/omarchy) walk in recursively,
    # resolved through the shared repo cache (~/.cache/charly/repos). A bed is
    # addressed by its QUALIFIED name (`charly.check-pod`, `arch.check-arch-vm`, …).
    - charly: ./charly
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    # Build-speed tunables (see charly/charly.yml's own defaults for the rationale).
    jobs: 4
    podman_jobs: 0
    podman_jobs_cap: 8
    # Keep the newest 3 distinct images (and at most 3 tags of each) per box after a
    # build. Without this the umbrella retained EVERY charly-labeled build image
    # indefinitely — 175 tagged images (27x arch, 27x cachyos, 27x arch-builder, ...)
    # accumulated and filled the host disk. `charly clean` applies the same retention
    # on demand; this default makes the post-build prune enforce it automatically.
    keep_images: 3
    keep_check_runs: 3
# =============================================================================
# The umbrella project manifest — the maintenance TASK surface.
#
# The umbrella is a view of the org: ~400 submodules at the root, each a real repo
# owned elsewhere. It declares NO candies/boxes of its own — only the maintenance
# TASK surface (`charly task <name>`), which replaced the former Taskfile.yml + the
# human-facing scripts/*.sh.
#
# Run `charly task list` for the surface. The binary comes from the `charly/`
# submodule: build it ONCE per clone with `./charly/scripts/bootstrap-charly.sh`
# (the ONE non-charly entrypoint — the build that PRODUCES the binary cannot itself
# be a charly task), then `./charly/bin/charly task <name>`.
#
# EVERY step declares its execution context, and the declared set must contain one the
# plan runner can activate: `build` in box mode, `runtime` in live mode. `deploy` is the
# install-LOWERING axis (the candy build/deploy verbs) and the plan runner activates it in
# NEITHER mode, so a `[deploy]`-only step names a context no mode has.
#
# A task's own step is NOT gated on that value today, and the reason is worth stating so the
# next reader does not mistake "inert" for "correct": the `task` verb supplies its own
# grammar — `taskGrammar{InContext → true}` (plugin-task/candy/plugin-task/grammar.go, wired
# in `newTaskRunner`, plugin-task/candy/plugin-task/runner.go) — which reports every step
# in-context unconditionally, because a task is host-native and has no image-build timeline
# to separate. That file documents this as the grammar seam's purpose. The check engine's own
# plans (candy `plan:`, check beds) are walked with `checkkit.PlanGrammar` instead, where the
# value IS consulted, so a step that drifts into one is a genuine no-op there.
#
# An OMITTED `context:` is not the same hazard, and the difference is worth recording: the
# fallback (`opEffectiveContexts`, charly/charly/planrun_adapter.go) is the verb's VerbCatalog
# entry, and every step here is authored as `<word>: <input>` sugar, which desugars to the
# generic `plugin` verb — whose entry is the permissive build+deploy+runtime. So an omission
# inherits "may run in any mode" rather than dying. It is still an unstated choice, and this
# file's convention is that every step states its own; `config:` (build-only) is the standing
# reminder that the inherited default is not always the permissive one.
#
# `verify`'s composed step carries the rest of the reasoning, and
# `scripts/check-task-contexts.mjs` — a step of `verify` AND of the `hooks/pre-commit` gate —
# enforces the rule on every task in this file. #413 is where the seven maintenance tasks
# were corrected.
# =============================================================================

# -----------------------------------------------------------------------------
# map — list every submodule with its pin and sync state.
# -----------------------------------------------------------------------------
map:
  task:
    description: List every submodule with its pin and sync state
    dir: .
    plan:
      # Composes the ONE status implementation (verb:git-submodules status) — the
      # same table `pins MODE=status` produces. The former inline shell
      # re-implemented that table (R3 duplication) AND its `command` stdout was
      # discarded by the task reporter (the `command` verb's pass path returns only
      # `exit=N`), so `map` printed no map at all. Composition makes the verb's
      # table the step's Result.Message, which plugin-task v0.2026268.1402 renders.
      # A `task:` verb wrapper is deliberately NOT used: verb:task returns only a
      # one-line summary, which would discard the table again.
      - run: print the submodule map
        git-submodules:
          mode: status
        context: [runtime]

# -----------------------------------------------------------------------------
# pins — the ONE policy-B pin operation (the former scripts/lib/policy-b.sh's role:
# a single canonical definition, not copy-pasted). `policy-b`, `sync` and `verify`
# are thin wrappers selecting the mode, so the 6-entry map exists exactly once.
# -----------------------------------------------------------------------------
pins:
  task:
    description: The policy-B pin operation over the distro-* set (mode via param)
    dir: .
    params:
      MODE:
        description: status|bump|verify (the git-submodules mode)
        default: verify
    plan:
      - run: run git-submodules in the selected mode
        git-submodules:
          mode: "${MODE}"
          pinned_from: charly
          # umbrella path -> its twin in the pinned charly checkout
          pin_map:
            distro-arch: box/arch
            distro-cachyos: box/cachyos
            distro-debian: box/debian
            distro-fedora: box/fedora
            distro-omarchy: box/omarchy
            distro-ubuntu: box/ubuntu
        context: [runtime]

# -----------------------------------------------------------------------------
# policy-b — the cheap, PR-violable pinning assertion (the pre-commit gate).
# -----------------------------------------------------------------------------
policy-b:
  task:
    description: Assert policy B — every distro-* gitlink equals charly's own box/* gitlink
    dir: .
    plan:
      - check: policy B holds
        task:
          task: pins
          param: [MODE=verify]
        context: [runtime]

# -----------------------------------------------------------------------------
# self-test — exercise the two committed CI-body builder scripts (their --self-test
# runs on every commit; the scripts stay because they are umbrella-specific PR-body
# generators, not maintenance sweeps the generic verbs cover).
# -----------------------------------------------------------------------------
self-test:
  task:
    description: Self-test the committed CI body/pin-evidence builders + the dispatcher splice
    dir: .
    plan:
      - run: self-test sync-pin-evidence + sync-pr-body + sync-dispatcher
        command: |
          set -eu
          bash scripts/sync-pin-evidence.sh --self-test
          bash scripts/sync-pr-body.sh --self-test
          bash scripts/sync-dispatcher.sh --self-test
        context: [runtime]

# -----------------------------------------------------------------------------
# hooks — install the pre-commit gate for this clone.
# -----------------------------------------------------------------------------
hooks:
  task:
    description: Install the clone-level git hooks — pre-commit (policy B, the self-tests, the opencode, pi and pr-watch gates) and pre-push (the PR-body gate)
    dir: .
    plan:
      - run: set core.hooksPath and report it
        command: |
          git config core.hooksPath hooks
          echo "core.hooksPath = $(git config --get core.hooksPath) — hooks/pre-commit and hooks/pre-push are live"
        context: [runtime]

# -----------------------------------------------------------------------------
# sync — bump every submodule pin per policy B (preview; does not commit).
# The charly-pinned set is the six distro-* repos: charly rolls to its own
# default-branch HEAD FIRST, and distro-* are then pinned from charly's NEW
# gitlinks (the verb's phase order).
# -----------------------------------------------------------------------------
sync:
  task:
    description: Bump all submodule pins per policy B (preview; does not commit)
    dir: .
    plan:
      - run: bump the pins (charly rolls first, then distro-* from its new gitlinks)
        task:
          task: pins
          param: [MODE=bump]
        context: [runtime]

# -----------------------------------------------------------------------------
# verify — the FULL pinning gate (every pin, incl. the per-submodule remote
# branch audit). The policy-B pin half and the checkout audit are ONE verb,
# verb:git-submodules (the former hand-rolled checkout loop is deleted: it was a
# second implementation of a clause the verb already owns, and the drift it kept
# reintroducing is the reason R3 exists). The default-branch audit and charly's
# nested-submodule check stay INLINE — no verb owns either clause. The inline
# nested step is exercised by scripts/check-verify-submodules.mjs.
# -----------------------------------------------------------------------------
verify:
  task:
    description: Run the full pinning gate on demand (every pin, incl. the remote branch audit)
    dir: .
    plan:
      - check: policy B — every distro-* gitlink equals charly's own box/* gitlink
        task:
          task: pins
          param: [MODE=verify]
        context: [runtime]
      # The verb is composed HERE rather than left to the `pins MODE=verify` step above,
      # which reaches it through a `task:` wrapper: `task:` (verb:task) returns only a
      # one-line summary and would DISCARD the verb's Message — the same reason the `map`
      # task composes the verb directly instead of wrapping it. The coverage that proves
      # this audit ran (`N checkout(s) clean at their gitlink`, plus the uninitialized
      # count) exists only in that Message, and a `command:` step's stdout does not
      # survive the pass path at all.
      - check: every submodule is clean and checked out at its recorded gitlink — the ONE verb that owns the clause (its coverage rides its Message, the channel that renders on the pass path; a command step's does not)
        git-submodules:
          mode: verify
          pin_map: {}
        # [runtime] — the value the combined step this one replaces declared (`verify` carried
        # 15 steps before #412, every one of them [runtime]) and the value every other step of
        # this task declares. `Runner.ContextSkipReason` (sdk/kit/runner.go) activates only
        # box→build and live→runtime, and `PlanGrammar.InContext` (sdk/checkkit/checkkit.go) is a
        # plain membership test, so a `deploy`-declared step names a context the runner never
        # activates. The seven maintenance tasks declared exactly that; #413 corrected them to
        # the value the three tasks that already carried one use, and
        # scripts/check-task-contexts.mjs now turns a set disjoint from [build, runtime] RED if
        # it comes back.
        context: [runtime]
      - check: every submodule's branch equals its remote default — KEPT INLINE, deliberately, because no verb owns this clause, and it is the expensive half (one git ls-remote per submodule, hence the timeout below)
        timeout: 20m
        command: |
          set -eu
          fail() { echo "FAIL: $*" >&2; exit 1; }
          mapfile -t MODULES < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          [ "${#MODULES[@]}" -ge 20 ] || fail "suspiciously few submodules (${#MODULES[@]})"
          for path in "${MODULES[@]}"; do
            url="$(git config -f .gitmodules --get "submodule.$path.url" 2>/dev/null || true)"
            branch="$(git config -f .gitmodules --get "submodule.$path.branch" 2>/dev/null || true)"
            [ -n "$url" ] || fail "$path: no url in .gitmodules"
            [ -n "$branch" ] || fail "$path: missing branch= in .gitmodules"
            default="$(git ls-remote --symref "$url" HEAD | sed -n 's/^ref: refs\/heads\/\(.*\)\tHEAD/\1/p')"
            [ "$branch" = "$default" ] || fail "$path: branch=$branch but remote default is $default"
          done
          echo "verify: OK — ${#MODULES[@]} submodule(s): branch == remote default for every one"
        context: [runtime]
      - check: charly's own nested submodules are at their gitlinks — KEPT INLINE, because the verb has no recursive-nested clause
        command: |
          set -eu
          fail() { echo "FAIL: $*" >&2; exit 1; }
          # `+` (drifted off charly's gitlink) and `U` (unmerged) are failures;
          # `-` (declared, not initialized) is not a violation, only reported.
          if [ -e charly/.git ]; then
            nested="$(git -C charly submodule status --recursive || true)"
            drift="$(printf '%s\n' "$nested" | grep -E '^[+U]' || true)"
            [ -z "$drift" ] || fail "charly nested submodules not at their gitlinks:
          $drift"
            notinit="$(printf '%s\n' "$nested" | grep -cE '^-' || true)"
            [ "$notinit" = "0" ] || echo "verify: notice — ${notinit} of charly's nested submodules are NOT INITIALIZED (no checkout); a + or U drift would still FAIL."
          else
            echo "verify: notice — charly/ is NOT INITIALIZED: its nested-submodule check is EMPTY (git submodule update --init charly)."
          fi
          echo "verify: OK — charly's nested submodules are at their gitlinks, none drifted"
        context: [runtime]
      - check: the nested-submodule step above — an uninitialized nested path is a NOTICE, a `+`/`U` drift still FAILS (fixtures)
        command: node scripts/check-verify-submodules.mjs
        context: [runtime]
      - check: every step of every task in this file declares a `context:` the plan runner activates — a set disjoint from [build, runtime] (the `[deploy]` this file used to carry) is a no-op in EVERY mode (fixtures)
        command: node scripts/check-task-contexts.mjs
        context: [runtime]
      - check: the opencode gate plugin contract (the check-opencode-plugin gate the former verify-pins.sh ran)
        command: node scripts/check-opencode-plugin.mjs
        context: [runtime]
      - check: the PR-watch plugin's pure logic + its shipped (uncommented) SDK delivery primitives
        command: node scripts/check-pr-watch.mjs
        context: [runtime]
      - check: the agent-progress monitor+control plugin — static (no .sh), the classifier (RCA regression), and a read-only store
        command: node scripts/check-agent-progress.mjs
        context: [runtime]
      - check: the session tracker plugin — the durable ledger (rule 9 invariant), the three tools, and the real-binary load
        command: node scripts/check-issue-tracker.mjs
        context: [runtime]
      - check: every harness-config surface parses and is wired (rule 5)
        command: node scripts/check-harness-config.mjs
        context: [runtime]
      - check: the harness-config gate discriminates — each mutation turns it RED (fixtures)
        command: node scripts/check-harness-config.mjs --self-test
        context: [runtime]
      - check: the pi gate extension fails CLOSED, uses the rule-2 worktree path, and wires both gate scripts
        command: node scripts/check-pi-gates.mjs
        context: [runtime]
      - check: the pi wake binding delegates to the neutral watchers, wakes, re-arms, cleans up, and ships inert + wired
        command: node scripts/check-pi-watch.mjs
        context: [runtime]
      - check: the pi PR-status tool parses, normalises the state, finds the run by head SHA, reads jobs via REST, and classifies INCONCLUSIVE
        command: node scripts/check-pi-pr-status.mjs
        context: [runtime]
      - check: the pi `question` tool is dependency-free, headless-safe, serialized, and wired into .pi/settings.json
        command: node scripts/check-pi-question.mjs
        context: [runtime]
      - check: the harness-neutral R10 bed watcher classifies exit codes and parses summary.yml (self-test)
        command: bash scripts/check-bed-watch.sh --self-test
        context: [runtime]
      - check: "every canonical root narrative exists and every root-file reference in the agent surfaces resolves (the #356 content-loss gate)"
        command: node scripts/check-root-refs.mjs
        context: [runtime]
      - check: the root-ref gate discriminates — each mutation turns it RED (fixtures)
        command: node scripts/check-root-refs.mjs --self-test
        context: [runtime]

# -----------------------------------------------------------------------------
# skills — splice the generated R0 dispatcher from the pinned marketplace.
# -----------------------------------------------------------------------------
skills:
  task:
    description: Splice the generated R0 dispatcher from the pinned marketplace into AGENTS.md
    dir: .
    plan:
      - run: splice the dispatcher (no-op until the fragment AND target markers exist)
        command: bash scripts/sync-dispatcher.sh
        context: [runtime]

# -----------------------------------------------------------------------------
# org-map — verify the README's org-map tables against .gitmodules.
# -----------------------------------------------------------------------------
org-map:
  task:
    description: Verify the README "## The org map" tables against the repo and .gitmodules
    dir: .
    plan:
      - check: every section reconciles, is sorted, and every submodule has a row
        command: |
          python3 - <<'PY'
          import re, subprocess, sys
          read = lambda p: open(p).read()
          readme = read("README.md")
          gitmodules = read(".gitmodules")
          body = readme[readme.index("## The org map"):readme.index("## Pinning")]
          sections = re.split(r"\n(?=### )", body)[1:]
          fail = 0
          print(f"{'section':26s} {'claimed':>7s} {'rows':>5s} {'sorted':>7s}")
          for sec in sections:
              name = sec.split("\n", 1)[0].strip()
              rows = re.findall(r"^\| `([^/]+)/`", sec, re.M)
              claimed_m = re.search(r"^(\d+) repos", sec, re.M)
              claimed = int(claimed_m.group(1)) if claimed_m else -1
              sorted_ok = rows == sorted(rows)
              ok = len(rows) == claimed and sorted_ok
              fail += 0 if ok else 1
              print(f"{name:26s} {claimed:7d} {len(rows):5d} {'yes' if sorted_ok else 'NO':>7s}")
          mods = re.findall(r'^\[submodule "([^"]+)"\]', gitmodules, re.M)
          rowpaths = set(re.findall(r"^\| `([^/]+)/`", body, re.M))
          missing = [m for m in mods if m not in rowpaths]
          hdr_m = re.search(r"every OpenCharly repo \((\d+) today\)", readme)
          hdr = hdr_m.group(1) if hdr_m else "?"
          print()
          print(f"submodules in .gitmodules : {len(mods)}")
          print(f"submodules with no row    : {missing if missing else 'none'}")
          print(f"header '(N today)'        : {hdr}  matches={hdr == str(len(mods))}")
          if fail or missing or hdr != str(len(mods)):
              print(f"\nFAIL: {fail} section(s) mismatched, {len(missing)} rowless, header={hdr}")
              sys.exit(1)
          print("\nOK: all sections reconcile and are sorted; every submodule has a row")
          PY
        context: [runtime]

# -----------------------------------------------------------------------------
# prune — reap the merged-upstream session worktrees + branches the per-session
# close-out prose never collected. Default MODE=report is a DRY RUN that changes
# nothing; MODE=prune performs the removal. A branch is pruned only when its merge
# is PROVEN (tip is an ancestor of origin/main, OR its PR is MERGED and its tip is
# contained in the merged head — the squash-merge case git ancestry alone cannot
# see); a branch carrying unmerged commits beyond a merged head is NEVER touched,
# and a worktree with modified tracked files is skipped. If `gh` is unavailable
# (no auth / offline) the sweep prunes strictly LESS, never more.
# -----------------------------------------------------------------------------
prune:
  task:
    description: Reap merged-upstream session worktrees + branches (MODE=report is a dry run)
    dir: .
    params:
      MODE:
        description: report (dry run) | prune (perform the removal)
        default: report
    plan:
      - run: prune merged-upstream worktrees and branches across the umbrella + submodules
        prune:
          mode: "${MODE}"
        context: [runtime]

# `charly check run check-all-beds` enumerates EVERY disposable bed in EVERY
# imported namespace (select defaults to '*'), runs them at `lanes` parallelism,
# serializes exclusive-resource token groups (auto-derived from each bed's own
# requires_exclusive:/requires_shared:), refuses host-local beds (they mutate the
# operator workstation), and aggregates honest exit codes.
#
# `charly check-roster` is a FLAT kind served by candy/plugin-check (compiled into
# the charly binary). Run it with a charly binary that carries this cutover:
#   charly/bin/charly -C <umbrella-root> check run check-all-beds
check-all-beds:
    check-roster:
        # select defaults to '*' — every disposable bed, namespace-qualified.
        lanes: 16
        # Enforced on every VM bed the roster runs (threaded to `charly vm create`).
        cpu: 2
        ram: 2G
        # Negative controls: their CORRECT outcome is a check failure (exit 2).
        expected_fail:
            - charly.check-r10-two-vm-fail
            - charly.check-r10-stage-race
        # Excluded: an `iterate:` AI-iteration loop, not a deterministic R10 bed.
        exclude:
            - charly.check-preflight-local
        # host-local beds (they apply candies to THIS workstation) are refused by
        # default; leave refuse_host_local unset for the safe default.
