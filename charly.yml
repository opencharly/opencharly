# The umbrella root project — a view over the org's submodules. It declares the
# check-bed ROSTER (which disposable beds run together as one gate), reached via the
# local-path import below, AND the maintenance TASK surface (`charly task <name>`).
# The beds themselves live in the submodules (charly/, distro-*).
repo: github.com/opencharly/opencharly
import:
    # The charly submodule, by LOCAL PATH. Its own entities (the main repo's
    # disposable beds + vm templates) and its OWN @github imports (the distro
    # namespaces: arch/cachyos/debian/fedora/ubuntu/omarchy) walk in recursively,
    # resolved through the shared repo cache (~/.cache/charly/repos). A bed is
    # addressed by its QUALIFIED name (`charly.check-k3s-vm`, `arch.check-arch-vm`,
    # `openclaw.check-openclaw-pod`, …).
    - charly: ./charly
    # opencharly/layer-openclaw — the OpenClaw AI-gateway family (the gateway image,
    # its candy and its disposable bed), imported under the `openclaw` namespace, so
    # its entities are addressed qualified — the bed is `openclaw.check-openclaw-pod`.
    # Its own repo lives at github.com/opencharly/layer-openclaw; the cutover that
    # consolidated it is tracked in opencharly/opencharly#431. The namespace comes from
    # THIS import key, not
    # from the repo's name.
    - openclaw: ./layer-openclaw
    # opencharly/layer-strata — the Strata family: the inference engine layer, its
    # cachyos-based image and the GPU bed `strata.check-strata-gpu-pod` (the GPU-free
    # mock mode is a runtime posture, not a bed; the withdrawn mock bed was PR #6).
    # Imported under `strata`, so its entities are addressed qualified.
    # Local path, like every entry here: the version rides the GITLINK, advanced with
    # `charly task sync` (Part II #3), never a tag in the URL.
    - strata: ./layer-strata
    # opencharly/plugin-strata — the `charly strata` management CLI over HTTP, an
    # out-of-tree command plugin. A DISTINCT key, because the namespace is the key and
    # `strata` is taken above.
    - strata-cli: ./plugin-strata
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    # Build-speed tunables (see charly/charly.yml's own defaults for the rationale).
    jobs: 4
    podman_jobs: 0
    podman_jobs_cap: 8
    # Keep the newest 3 distinct images (and at most 3 tags of each) per box after a
    # build. Without this the umbrella retained EVERY charly-labeled build image
    # indefinitely — 175 tagged images (27x arch, 27x cachyos, 27x arch-builder, ...)
    # accumulated and filled the host disk. `charly clean` applies the same retention
    # on demand; this default makes the post-build prune enforce it automatically.
    keep_images: 3
    keep_check_runs: 3
# =============================================================================
# The umbrella project manifest — the maintenance TASK surface.
#
# The umbrella is a view of the org: ~400 submodules at the root, each a real repo
# owned elsewhere. It ships NO image and composes NO box — its only candy is the
# `opencharly-guidance` CONCEPT candy below, which exists to OWN the org's
# general-guidance skills (Part II #5: a skill with no code, plugin, or config
# behind it belongs here, the one repo every consumer shares — and, by the same
# rule's measured exception, a skill whose config repo cannot author skills; the
# block below names both cases). Everything else on this manifest is the
# maintenance TASK surface (`charly task <name>`), which replaced the former
# Taskfile.yml + the human-facing scripts/*.sh.
#
# Run `charly task list` for the surface. The binary comes from the `charly/`
# submodule: build it ONCE per clone with `./charly/scripts/bootstrap-charly.sh`
# (the ONE non-charly entrypoint — the build that PRODUCES the binary cannot itself
# be a charly task), then `./charly/bin/charly task <name>`.
#
# EVERY step declares its execution context, and the declared set must contain one the
# plan runner can activate: `build` in box mode, `runtime` in live mode. `deploy` is the
# install-LOWERING axis (the candy build/deploy verbs) and the plan runner activates it in
# NEITHER mode, so a `[deploy]`-only step names a context no mode has.
#
# A task's own step is NOT gated on that value today, and the reason is worth stating so the
# next reader does not mistake "inert" for "correct": the `task` verb supplies its own
# grammar — `taskGrammar{InContext → true}` (plugin-task/candy/plugin-task/grammar.go, wired
# in `newTaskRunner`, plugin-task/candy/plugin-task/runner.go) — which reports every step
# in-context unconditionally, because a task is host-native and has no image-build timeline
# to separate. That file documents this as the grammar seam's purpose. The check engine's own
# plans (candy `plan:`, check beds) are walked with `checkkit.PlanGrammar` instead, where the
# value IS consulted, so a step that drifts into one is a genuine no-op there.
#
# An OMITTED `context:` is not the same hazard, and the difference is worth recording: the
# fallback (`opEffectiveContexts`, charly/charly/planrun_adapter.go) is the verb's VerbCatalog
# entry, and every step here is authored as `<word>: <input>` sugar, which desugars to the
# generic `plugin` verb — whose entry is the permissive build+deploy+runtime. So an omission
# inherits "may run in any mode" rather than dying. It is still an unstated choice, and this
# file's convention is that every step states its own; `config:` (build-only) is the standing
# reminder that the inherited default is not always the permissive one.
#
# `verify`'s composed step carries the rest of the reasoning, and
# `scripts/check-task-contexts.mjs` — a step of `verify` AND of the `hooks/pre-commit` gate —
# enforces the rule on every task in this file. #413 is where the seven maintenance tasks
# were corrected.
# =============================================================================

# -----------------------------------------------------------------------------
# The org's GENERAL-GUIDANCE skills (AGENTS.md Part II #5).
#
# A skill with no code, plugin, or config behind it belongs here, because the
# umbrella is the one repo every consumer shares and guidance with no home repo
# has nowhere else a consumer can reach it from. A skill whose described config
# DOES have a home repo that cannot AUTHOR skills — no `charly.yml`, no
# `.agents/` tree, so it can be neither a skill host nor a corpus source —
# belongs here for the same reason, as a deliberate exception: `git-workflow`
# and `repo-setup` describe `opencharly/.github`'s ruleset and workflows, and
# that repo can host neither (opencharly/opencharly#611). Every OTHER skill
# lives in the repo of the code, plugin, or config it describes — the
# destination map for a relocation is measured, never read off prose
# (opencharly/opencharly#606), and this family's own re-derivation is
# opencharly/opencharly#611.
#
# `opencharly-guidance` is a CONCEPT candy: it ships no install content, composes
# no box, and appears in no image — so these `skill:` nodes add nothing to any
# image. Its whole job is to OWN the routing metadata. The prose is the FILE at
# `.agents/skills/<name>/SKILL.md`; nothing here inlines a `description:` or a
# `content:` (an inline body that disagrees with its file is a hard error in the
# marketplace generator, and copying a body back into a node is how a skill
# drifts from the file that is its source).
# -----------------------------------------------------------------------------
opencharly-guidance:
    candy:
        description: |-
            Concept candy owning the umbrella's general-guidance skills — the ones with no code,
            plugin, or config behind them — and the exception of AGENTS.md Part II #5: the two skills
            whose config home, opencharly/.github, cannot author skills. It ships no install content
            and composes no image; it carries the family's `skill:` routing nodes, and the prose lives
            in `.agents/skills/<name>/SKILL.md` at this repo's root.
        plan:
            - run: this documentation-only candy ships no install content (it carries the org's general-guidance skill entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: every general-guidance skill node resolves to an authored body under .agents/skills
              id: opencharly-guidance-present
              context:
                - build
              command: "true"
agents-skill:
    skill:
        name: agents
        family: internals
        owner: opencharly-guidance
        triggers:
            - "Verify a cutover by running the R10 beds (drive `charly check run <bed>`)"
            - "Evaluate/audit a deployment config (image or deploy, yours)"
            - "Sub-agents / dynamic workflows / agent teams / agent-lifecycle or commit-push gate hooks"
            - "Monitor a subagent's progress / stop a stalled, idle, or looping worker"
            - "Todo ledger / interruption safety / never drop in-flight work across a new instruction"
cutover-policy-skill:
    skill:
        name: cutover-policy
        family: internals
        owner: opencharly-guidance
        triggers:
            - "Hard-cutover concerns / rename sweeps"
root-cause-analyzer-skill:
    skill:
        name: root-cause-analyzer
        family: internals
        owner: opencharly-guidance
git-workflow-skill:
    skill:
        name: git-workflow
        family: internals
        owner: opencharly-guidance
        triggers:
            - "Git/`gh` workflow \u2014 `feat/` branch, commit, PR-only landing (NO direct push to main), branch protection, the `pr-validator` fresh-evaluator gate, native auto-merge + tag-on-merge CalVer-at-merge, worktree, sync-to-upstream, branch/worktree prune, cross-repo R10 landing"
repo-setup-skill:
    skill:
        name: repo-setup
        family: internals
        owner: opencharly-guidance
        triggers:
            - "Set up a new repository in the opencharly org (required workflows, ruleset, auto-merge, CalVer tags)"
            - "How the org ruleset / dotgithub workflows / native auto-merge / tag-on-merge CalVer work"

# -----------------------------------------------------------------------------
# map — list every submodule with its pin and sync state.
# -----------------------------------------------------------------------------
map:
  task:
    description: List every submodule with its pin and sync state
    dir: .
    plan:
      # Composes the ONE status implementation (verb:git-submodules status) — the
      # same table `pins MODE=status` produces. The former inline shell
      # re-implemented that table (R2 duplication) AND its `command` stdout was
      # discarded by the task reporter (the `command` verb's pass path returns only
      # `exit=N`), so `map` printed no map at all. Composition makes the verb's
      # table the step's Result.Message, which plugin-task v0.2026268.1402 renders.
      # A `task:` verb wrapper is deliberately NOT used: verb:task returns only a
      # one-line summary, which would discard the table again.
      - run: print the submodule map
        git-submodules:
          mode: status
        context: [runtime]

# -----------------------------------------------------------------------------
# pins — the ONE pin-contract pin operation: a single canonical definition, not copy-pasted.
# `pin-check`, `sync` and `verify`
# are thin wrappers selecting the mode -- and `pins` itself carries `MODE=currency` -- so the 6-entry map exists exactly once.
# -----------------------------------------------------------------------------
pins:
  task:
    description: The pin-contract pin operation over the distro-* set (mode via param) — MODE=currency asks whether every pin is at the ref its intent names, and its Message IS the answer
    dir: .
    params:
      MODE:
        description: status|bump|verify|currency (the git-submodules mode)
        default: verify
    plan:
      - run: run git-submodules in the selected mode
        # The runner's per-attempt never-hang floor is 90s, and this verb's cost
        # scales with the ORG: MODE=currency asks every remote what they serve
        # (measured 4m00s–5m15s on 2026-10-23, umbrella trees f2c7db1 and 4f0777a)
        # and MODE=bump rolls every leaf submodule to its remote HEAD and re-pins
        # the edge ones (distro-*) to their source's twin.
        # A step the floor cuts short is KILLED mid-run, so the ceiling is declared
        # here — the mechanism's own parameter, not a sleep and not a retry.
        timeout: 30m
        git-submodules:
          mode: "${MODE}"
          pinned_from: charly
          # umbrella path -> its twin in the pinned charly checkout
          pin_map:
            distro-arch: box/arch
            distro-cachyos: box/cachyos
            distro-debian: box/debian
            distro-fedora: box/fedora
            distro-omarchy: box/omarchy
            distro-ubuntu: box/ubuntu
        context: [runtime]

# -----------------------------------------------------------------------------
# pin-check — the pin contract AS THE COMMIT GATE RUNS IT (the pre-commit gate's
# charly-backed leg). It is the WHOLE verb — `mode: verify` runs the EDGE and the
# CHECKOUT AUDIT in one call — because the gate's change class is derived from what
# the verb READS (opencharly/opencharly#661), and the checkout audit is one of the
# things it reads.
# -----------------------------------------------------------------------------
pin-check:
  task:
    description: Assert the pin contract — every distro-* gitlink equals charly's own box/* gitlink (the EDGE), and every submodule is clean and checked out at its recorded gitlink (the CHECKOUT AUDIT)
    dir: .
    plan:
      - check: the pin check holds
        task:
          task: pins
          param: [MODE=verify]
        context: [runtime]

# -----------------------------------------------------------------------------
# self-test — exercise the two committed CI-body builder scripts (their --self-test
# runs on every commit; the scripts stay because they are umbrella-specific PR-body
# generators, not maintenance sweeps the generic verbs cover) and the measurement
# script's clone path — the part of it that does NOT run in the ordinary measurement.
# -----------------------------------------------------------------------------
self-test:
  task:
    description: Self-test the committed CI body/pin-evidence builders + the dispatcher splice + the submodule initializer + the measurement's clone path
    dir: .
    plan:
      # The SET is owned by scripts/self-test.sh, so the commit gate can reach it
      # without the charly binary (opencharly/opencharly#498) and the two callers
      # cannot drift (R2).
      - run: self-test sync-pin-evidence + sync-pr-body + sync-dispatcher + init-submodules + measure-clone
        command: bash scripts/self-test.sh
        context: [runtime]

# -----------------------------------------------------------------------------
# hooks — install the pre-commit gate for this clone.
# -----------------------------------------------------------------------------
hooks:
  task:
    description: Install the clone-level git hooks — pre-commit (the pin check, the self-tests, the opencode, pi and pr-watch gates) and pre-push (the PR-body gate)
    dir: .
    plan:
      - run: set core.hooksPath and report it
        command: |
          git config core.hooksPath hooks
          echo "core.hooksPath = $(git config --get core.hooksPath) — hooks/pre-commit and hooks/pre-push are live"
        context: [runtime]

# -----------------------------------------------------------------------------
# init — materialize the umbrella's submodules ON DEMAND.
# The umbrella is a VIEW over the org: every repo in it is a submodule at the
# root, owned elsewhere. Materializing all of them costs 9.5 G on disk and
# minutes of network (measured 2026-10-22); the pins live in the umbrella's
# INDEX, and every pin is audited from the index, so a checkout is only needed
# for the repos you actually build against or edit.
# The working set is DERIVED by scripts/init-submodules.sh (the manifest's
# import: paths, the pin contract, and the harness corpus root) — never
# hand-listed, and a derived path that is not a declared submodule fails loud.
#
#   charly task init                                          the derived working set
#   CHARLY_INIT_MODE=all    charly task init                  every declared path
#   CHARLY_INIT_MODE=list   charly task init                  print it, change nothing
#   CHARLY_INIT_PATHS=a,b   charly task init                  the named paths
#
# MODE=all is for a FULL tree, not for a wave: the bump advances an unmaterialized
# pin IN THE INDEX (so a wave needs no full set), and it still fails loud, by
# design, for every path it CANNOT advance (a sync over a tree it could not fully
# advance must never report success). The daily tree is light, and so is a wave.
#
# THIS TASK IS NOT THE FIRST STEP on a fresh clone: the project cannot load
# before its import: paths exist, so the binary that runs this task does not
# exist yet either. `bash scripts/init-submodules.sh` is the pre-bootstrap path
# (it materializes `charly` itself), and this task is the SAME operation through
# the binary.
# -----------------------------------------------------------------------------
init:
  task:
    description: Materialize the umbrella's submodules — the derived working set by default; CHARLY_INIT_MODE=all|list and CHARLY_INIT_PATHS select the others
    dir: .
    plan:
      - run: materialize the umbrella's submodules
        # The MODE arrives in the OPERATOR'S ENVIRONMENT, and the script reads
        # it — this command text carries NO operator value at all, which is the
        # whole point. Measured, not assumed:
        #   - the plan runner substitutes an UPPER-CASE param's VALUE into the
        #     command TEXT, and the shell then PARSES that text, so a param
        #     carrying a shell metacharacter EXECUTES (measured: `--param
        #     'EVIL=$(touch /tmp/marker)'` created the marker);
        #   - a LOWER-CASE param is not substituted at all — the expander's
        #     grammar is upper-case-initial (sdk/kit/checkvars_expand.go) — so
        #     the reference reaches the shell, the shell has no such variable,
        #     and the empty word VANISHES: the command runs with the value
        #     silently missing;
        #   - a param cannot reach a command step's process environment either:
        #     the step's `env:` modifier is applied VERBATIM, so it cannot carry
        #     one;
        #   - the plan runner ALSO expands a braced UPPER-CASE reference in the
        #     command text against the task's own merged env, and one it cannot
        #     resolve SKIPS a `check:` step instead of failing it (observed
        #     2026-10-22: the branch-audit step's braced
        #     `AUDIT_JOBS:-16` read was skipped — "unresolved variables:
        #     AUDIT_JOBS:-16" — and `charly task verify` still exited 0 while
        #     the 431-call branch audit never ran). A braced read of the
        #     environment would therefore be a silent no-op, not a read.
        # An ENVIRONMENT value is DATA: the shell never re-parses the result of
        # a parameter expansion, so the value cannot become source. The step
        # inherits the operator's environment (measured), and the script owns
        # the mode, the comma-split and the validation of every path against
        # the declared set (an undeclared path fails loud).
        command: bash scripts/init-submodules.sh
        # A step with no timeout is bounded by the runner's per-step never-hang
        # floor — the host's readiness per-attempt ceiling, 120 s in the pinned
        # spec's readinessPerAttemptFallback — and a full wave needs longer than
        # that: git clones every declared path in parallel and then checks them out ONE
        # AT A TIME, and a blobless checkout lazily fetches its tree's blobs
        # from the remote. Measured on 2026-10-22: an --all wave hit that floor
        # with 385 of 431 paths cloned but never checked out — a state `git
        # submodule status` reports as at-the-pin. The timeout is raised here so
        # the wave finishes, and the script verifies and repairs the tree either
        # way.
        timeout: 30m
        context: [runtime]

# -----------------------------------------------------------------------------
# sync — bump every submodule pin per the pin contract (preview; does not commit).
# The charly-pinned set is the six distro-* repos: charly rolls to its own
# default-branch HEAD FIRST, and distro-* are then pinned from charly's NEW
# gitlinks (the verb's phase order).
#
# A WAVE NEEDS NO FULL SET: the bump advances a path with no checkout IN THE
# INDEX (a leaf to the tip its remote serves for its `branch=`, an edge to the
# twin the source's tree records), and a path WITH a checkout is still rolled in
# that checkout, so the two keep agreeing. It still fails loud for every path it
# CANNOT advance (a sync over a tree it could not fully advance must never
# report success). A wave's order is SYNC → INIT → VERIFY: the sync writes the
# pins, the init materializes the checkouts AT those pins, and the verify
# judges them. The daily tree stays light, and so does a wave.
# -----------------------------------------------------------------------------
sync:
  task:
    description: Bump all submodule pins per the pin contract (preview; does not commit)
    dir: .
    plan:
      - run: bump the pins (charly rolls first, then distro-* from its new gitlinks)
        # The bump rolls every leaf submodule to its remote HEAD and re-pins the
        # edge ones (distro-*) to their source's twin, so the hop's own attempt
        # carries a declared ceiling above the runner's 90s floor — a hop the floor
        # cuts short leaves the wave HALF done and still reporting success.
        timeout: 30m
        task:
          task: pins
          param: [MODE=bump]
        context: [runtime]
      - run: re-derive the harness skill bindings from the corpus the bump just advanced (the DSH farm and reasonix.toml's [skills] paths — a pin advance that skips this leaves them a family behind)
        command: node scripts/sync-skill-bindings.mjs
        context: [runtime]

# -----------------------------------------------------------------------------
# verify — the FULL pinning gate (every pin, incl. the per-submodule remote
# branch audit). The pin-contract edge half and the checkout audit are ONE verb,
# verb:git-submodules (the former hand-rolled checkout loop is deleted: it was a
# second implementation of a clause the verb already owns, and the drift it kept
# reintroducing is the reason R2 exists). The default-branch audit and charly's
# nested-submodule check stay INLINE — no verb owns either clause. The inline
# nested step is exercised by scripts/check-verify-submodules.mjs.
# -----------------------------------------------------------------------------
verify:
  task:
    description: Run the full pinning gate on demand (every pin, incl. the remote branch audit)
    dir: .
    plan:
      # ONE composition of the pin verb, and ONE only. `mode: verify` runs BOTH halves of
      # the pin contract in a single call — half 1 the derived EDGE (every `pin_map` entry
      # equals `pinned_from`'s twin) and half 2 the checkout audit over EVERY `.gitmodules`
      # path — so the verb is composed HERE once, through the `pins` task that is its ONE
      # canonical definition (the 6-entry map exists exactly once, in `pins`).
      #
      # WHAT THIS REPLACES, and why the old shape was a defect rather than a style choice:
      # this task used to compose the verb TWICE — the `task: pins` wrapper for the edge half,
      # then a bare `git-submodules` step carrying `pin_map: {}` for the checkout half. The
      # second composition could only ever report `0 policy pin(s)`, because the map it was
      # given was empty, so two honest pastes of one tree printed `verify: 0` and `verify: 6`
      # depending on which composition was read. One verb, one composition: the wrapper's
      # failure still fails the task (that is the gate), and the counts are computed once.
      #
      # The wrapper's Message now CARRIES the wrapped run's own report: the `task:` hop
      # composes the nested steps' messages instead of discarding them (opencharly/plugin-task#36,
      # adopted by this repo's `charly` pin), so the verb's own policy-pin and checkout
      # counts reach this task's verdict. The loss that was filed at opencharly/plugin-task#33
      # is fixed AT ITS OWNER, and this task still re-composes nothing — one verb, one
      # composition, which is what produced the contradictory counts.
      - check: the pin contract holds — every distro-* gitlink equals charly's own box/* gitlink (the EDGE), and every submodule is clean and checked out at its recorded gitlink (the CHECKOUT AUDIT), composed ONCE through `pins`
        # The composed run walks every checkout, so the hop's own attempt carries a
        # declared ceiling above the runner's 90s floor: a hop the floor cuts short
        # would leave THIS gate — the one that says the tree agrees with itself —
        # reporting success over a half-finished audit.
        timeout: 10m
        task:
          task: pins
          param: [MODE=verify]
        context: [runtime]
      # The CURRENCY question, which the consistency half above does not answer: `verify`
      # asserts that each checkout equals the gitlink the INDEX records; currency asks
      # whether each pin is at the ref its INTENT names. A tree can be perfectly consistent
      # while every pin is behind what its repo serves (opencharly/opencharly#621), and
      # nothing in the gate said so.
      #
      # The verb answers it in the shape a control wants: StatusPass with a message that
      # NAMES every pin that is not current and the producer-first legs that would make it
      # current. So this step REPORTS the currency without reddening the gate — a behind pin
      # is an advance available NOW, in that producer's own repo, not a broken edge, and a
      # gate that failed on it would be permanently red on a healthy tree. A STRUCTURAL
      # failure — a pin the workflow cannot judge, or two sides that disagree — is still a
      # FAIL, and that is the point of the step.
      - check: each pin's CURRENCY — the pin is at the ref its intent names (the question the consistency half above does not answer)
        # CURRENCY asks every remote what they serve: measured 4m00s–5m15s on
        # 2026-10-23, umbrella trees f2c7db1 and 4f0777a, so the hop's attempt
        # carries a declared ceiling above the runner's 90s floor.
        timeout: 15m
        task:
          task: pins
          param: [MODE=currency]
        context: [runtime]
      - check: every submodule's branch equals its remote default — KEPT INLINE, deliberately, because no verb owns this clause, and it is the expensive half (one git ls-remote per submodule, hence the timeout below)
        timeout: 20m
        command: |
          set -eu
          fail() { echo "FAIL: $*" >&2; exit 1; }
          # One ls-remote per submodule is the EXPENSIVE half of this gate: those
          # calls took 192 s to 212 s SERIAL, and 13 s to 15 s run in PARALLEL
          # at -P 16 (the band over every sample of this step, measured
          # 2026-10-22 and 2026-10-23, over repeated runs). The
          # clause is unchanged — same .gitmodules parsing, same comparison, same
          # message, same exit status — and it gains one property a serial loop
          # could not have: a parallel run cannot stop at the first mismatch without
          # losing the rest, so EVERY mismatching path is named.
          # The parallelism is an OPERATOR value, and it travels in the ENVIRONMENT, never
          # in this text. The plan runner expands a braced reference in a command's text
          # against the task's merged env (kit.ExpandOpVars), so a braced read HERE is
          # CLAIMED by the runner — and an unresolvable one does not fail the step, it
          # SKIPS it, and the gate reads green while the audit never ran. Observed
          # 2026-10-22: a braced read of AUDIT_JOBS → the whole step skipped
          # ("unresolved variables: AUDIT_JOBS:-16") and `charly task verify` still
          # exited 0. The value is read at RUN TIME, out of the process environment, so
          # the expander never sees it — through `printenv` rather than a bare `$NAME`,
          # because this step runs under `set -eu`, where an unset variable would abort
          # the step before the audit ran at all.
          JOBS="$(printenv AUDIT_JOBS 2>/dev/null || true)"
          [ -n "$JOBS" ] || JOBS=16
          case "$JOBS" in ''|*[!0-9]*) fail "AUDIT_JOBS must be a positive integer (got '$JOBS')";; esac
          [ "$JOBS" -ge 1 ] || fail "AUDIT_JOBS must be at least 1 (got '$JOBS')"
          tmp="$(mktemp)"; paths="$(mktemp)"
          trap 'rm -f "$tmp" "$paths"' EXIT
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' > "$paths"
          count="$(grep -c . "$paths" || true)"
          [ "$count" -ge 20 ] || fail "suspiciously few submodules ($count)"
          while IFS= read -r path; do
            url="$(git config -f .gitmodules --get "submodule.$path.url" 2>/dev/null || true)"
            branch="$(git config -f .gitmodules --get "submodule.$path.branch" 2>/dev/null || true)"
            [ -n "$url" ] || fail "$path: no url in .gitmodules"
            [ -n "$branch" ] || fail "$path: missing branch= in .gitmodules"
            printf '%s\0%s\0%s\0' "$path" "$url" "$branch" >> "$tmp"
          done < "$paths"
          set +e
          xargs -0 -P "$JOBS" -n 3 sh -c '
            path="$1"; url="$2"; branch="$3"
            out=$(git ls-remote --symref "$url" HEAD 2>&1); rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "$path: git ls-remote failed: $out" >&2
              exit 1
            fi
            default=$(printf "%s\n" "$out" | sed -n "s/^ref: refs\/heads\/\(.*\)\tHEAD/\1/p")
            if [ "$branch" != "$default" ]; then
              shown="$default"; [ -n "$shown" ] || shown="<none>"
              echo "$path: branch=$branch but remote default is $shown" >&2
              exit 1
            fi
          ' _ < "$tmp"
          rc=$?
          set -e
          [ "$rc" -eq 0 ] || fail "the branch audit failed for one or more submodules (each one is named above)"
          echo "verify: OK — $count submodule(s): branch == remote default for every one"
        context: [runtime]
      - check: charly's own nested submodules are at their gitlinks — KEPT INLINE, because the verb has no recursive-nested clause
        command: |
          set -eu
          fail() { echo "FAIL: $*" >&2; exit 1; }
          # `+` (drifted off charly's gitlink) and `U` (unmerged) are failures;
          # `-` (declared, not initialized) is not a violation, only reported.
          if [ -e charly/.git ]; then
            nested="$(git -C charly submodule status --recursive || true)"
            drift="$(printf '%s\n' "$nested" | grep -E '^[+U]' || true)"
            [ -z "$drift" ] || fail "charly nested submodules not at their gitlinks:
          $drift"
            notinit="$(printf '%s\n' "$nested" | grep -cE '^-' || true)"
            [ "$notinit" = "0" ] || echo "verify: notice — $notinit of charly's nested submodules are NOT INITIALIZED (no checkout); a + or U drift would still FAIL."
          else
            echo "verify: notice — charly/ is NOT INITIALIZED: its nested-submodule check is EMPTY (git submodule update --init charly)."
          fi
          echo "verify: OK — charly's nested submodules are at their gitlinks, none drifted"
        context: [runtime]
      - check: the nested-submodule step above — an uninitialized nested path is a NOTICE, a `+`/`U` drift still FAILS (fixtures)
        command: node scripts/check-verify-submodules.mjs
        context: [runtime]
