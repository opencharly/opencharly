[permissions]
mode = "ask"

# Narrowing rules only. A project `reasonix.toml` may NARROW the permission
# policy, never widen it: an `allow` list written here is parsed but produces
# ZERO rules (MEASURED — `reasonix doctor --json` reports allow_rules: 0 for a
# 9-entry list, while the same list in `~/.reasonix/config.toml` reports 2).
# An earlier revision of this file carried such a list under a "parity with
# Claude Code + Kimi + opencode" comment; it granted nothing, so it was removed
# rather than left to imply a policy this harness never applied. Widening, if
# wanted, belongs in the user config.
#
# `deny` and `ask` DO take effect here (MEASURED on this file: `reasonix doctor
# --json` reports deny_rules: 5, ask_rules: 3 — the 5 deny + 3 ask entries
# below, none dropped)
# and hold in every mode, which makes them stronger than the gate scripts: the
# hooks run your own code before a call, these refuse it outright.
deny = [
    # PR-only landing (AGENTS.md "Post-Execution Policies"): main advances only via a validated
    # PR merge, and no branch is ever force-pushed. The pre-push gate already
    # blocks these; the rule holds even if a hook is bypassed.
    "Bash(git push --force*)",
    "Bash(git push -f*)",
    "Bash(git push origin main*)",
    "Bash(git push origin HEAD:main*)",
    # Destructive working-tree operations (AGENTS.md R6).
    "Bash(rm -rf*)",
]

# The R10 bed verbs run code an operator should approve each time — `check run`
# builds, deploys, probes and tears down; `check box` starts a container;
# `check live` checks a running deployment. The same three are deliberately NOT
# auto-allowed in `opencode.json` (asserted by scripts/check-harness-config.mjs
# check 5), so asking here keeps the harnesses in step.
ask = [
    "Bash(charly check run*)",
    "Bash(charly check box*)",
    "Bash(charly check live*)",
]

# --- Agent ------------------------------------------------------------------
# Compaction parity with opencode.json. opencode sets `reserved: 384000` against
# a 1,048,576-token window, i.e. it compacts once ~664,576 tokens (63.4%) are
# used; reasonix's built-in default is 85%, so it would hold far more context
# before compacting than the opencode session this repo mirrors. MEASURED:
# `reasonix config compact-ratio` reports "85% (built-in default)" with no
# [agent] table here, and honours a project override ("70% (project:
# reasonix.toml)"). 0.70 is the nearest documented preset (the others are 0.80
# and 0.85) to opencode's effective 0.634, so it is the closest honest match —
# not an exact reproduction, which is why the derivation is recorded here.
#
# `[lsp]` needs no entry: reasonix's default is already `enabled = true`, which
# is what opencode.json's `"lsp": true` asks for (MEASURED — `reasonix doctor`
# reports `enabled true` with no [lsp] table present).
[agent]
compact_ratio = 0.70

# --- Skills ------------------------------------------------------------------
# The ONE thing that makes AGENTS.md's dispatcher usable in this harness. Every
# `/charly-<family>:<skill>` reference in AGENTS.md resolves to a `SKILL.md`
# under the `marketplace` submodule; without these roots, Reasonix scans only
# its own project convention dirs (`.reasonix/skills`, `.agents/skills`,
# `.agent/skills`, `.claude/skills` — none of which exist here) plus the user's
# global roots, so it resolves a dozen builtin/global skills and NOT ONE of the
# charly procedures. See REASONIX.md for how a reference maps to a call.
#
# These are the 42 directories that actually CONTAIN skills — every
# `<family>/skills/` (each holding `<skill>/SKILL.md`) plus the two
# `<family>/agents/` roster dirs (hand-authored `<agent>.md`, loaded as skills).
# COUNTED on 2026-10-06 at the marketplace pin this branch records (`ac7d97e5`):
# 40 `skills/` dirs holding 351 `SKILL.md`, and 2 `agents/` rosters holding 7
# `.md`. `kubevirt` and `qdrant` are the newest two families — the coverage
# assertion in check 8 is what caught their absence here.
# A single `paths = ["marketplace"]` does NOT work: `marketplace/` is a
# multi-FAMILY root, while reasonix expects a multi-SKILL root, so pointing at
# it makes reasonix scan family prose as skills — MEASURED (reasonix v2.28.0),
# 389 files warn `skill.missing_description` and print ~3,500 warning lines per
# boot (3,447 of them `marketplace/CHANGELOG/*.md`, plus the root
# AGENTS.md/DISPATCHER.md/README.md and two family READMEs). Scoping to the
# skill-bearing directories removes every such warning while loading the SAME
# skills, with no skill lost — a count of 362 loaded skills at that measurement.
# That figure is NOT re-measured here (reasonix is not installed on this host),
# so the count of record is the on-disk one above. Keep this list in step with
# the marketplace layout; `scripts/check-harness-config.mjs` check 8 asserts it
# covers every skill root.
[skills]
paths = [
    "marketplace/agent/skills",
    "marketplace/agentteams/skills",
    "marketplace/authoring/skills",
    "marketplace/automation/agents",
    "marketplace/automation/skills",
    "marketplace/bpf/skills",
    "marketplace/build/skills",
    "marketplace/cache/skills",
    "marketplace/candy-cli/skills",
    "marketplace/cardwire/skills",
    "marketplace/check/skills",
    "marketplace/coder/skills",
    "marketplace/comfyui/skills",
    "marketplace/core/skills",
    "marketplace/crabbox/skills",
    "marketplace/distros/skills",
    "marketplace/feature/skills",
    "marketplace/filebrowser/skills",
    "marketplace/hermes/skills",
    "marketplace/image/skills",
    "marketplace/immich/skills",
    "marketplace/infrastructure/skills",
    "marketplace/internals/agents",
    "marketplace/internals/skills",
    "marketplace/jupyter/skills",
    "marketplace/kubernetes/skills",
    "marketplace/kubevirt/skills",
    "marketplace/languages/skills",
    "marketplace/local/skills",
    "marketplace/ollama/skills",
