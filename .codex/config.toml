# OpenCharly keeps Codex constrained to this repository by default. Charly's
# approved disposable workloads, not an unrestricted host agent, provide the
# full candybox execution surface. Git metadata, normal host caches, network,
# and Charly deploy/R10 commands cross the sandbox through exact approvals.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# OpenCharly has a large curated skill catalog. Use Codex's documented maximum
# catalog budget; the AGENTS.md dispatcher remains the reliable selector.
[skills]
max_context_tokens = 10000

[sandbox_workspace_write]
network_access = false

# DeepWiki — a remote streamable-HTTP MCP server for architecture questions about a
# GitHub repository. Codex reads `[mcp_servers.<name>]` with `url` for a streamable HTTP
# server (https://learn.chatgpt.com/docs/extend/mcp, "Streamable HTTP"). The sandbox's
# `network_access = false` above gates only Codex's OWN Bash sandbox, not the MCP client.
[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"
