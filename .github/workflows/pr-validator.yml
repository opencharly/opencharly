# ORG-WIDE PR-VALIDATOR DISPATCHER — installed in every opencharly repo.
# The umbrella twin of charly/.github/workflows/pr-validator.yml. Charly waits on
# its `go` CI gate; the umbrella has no CI gate of its own — the verify workflow
# was deleted after an audit found its assertions were satisfied by the checkout
# itself, and the ones a commit can violate now run in hooks/pre-commit.
#
# Dispatches to the reusable org-wide workflow at opencharly/.github.
# `validate` is the only required check; native auto-merge handles the ordering.
name: charly/pr-validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: validate
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.fork == false
    uses: opencharly/.github/.github/workflows/pr-validator.yml@main
    with:
      pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}
      ai_review_provider: ${{ vars.AI_REVIEW_PROVIDER }}
      ai_review_model: ${{ vars.AI_REVIEW_MODEL }}
      ai_review_base_url: ${{ vars.AI_REVIEW_BASE_URL }}
    secrets: inherit
