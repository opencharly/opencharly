# ORG-WIDE TAG-ON-MERGE DISPATCHER — installed in every opencharly repo.
name: tag-on-merge

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pull-requests: read

jobs:
  tag:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    uses: opencharly/.github/.github/workflows/tag-on-merge.yml@main
    secrets: inherit
