name: sync

# Bumps every submodule pin per policy B and opens a `chore: sync gitlinks` PR
# when anything moved. The PR rides the org's auto-merge flow (auto-merge.yml),
# which merges once verify passes and tags the snapshot with a calver tag.

on:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Bump pins
        run: |
          # Captured so the PR body can PASTE what the producer actually resolved, rather
          # than assert that it ran. pipefail because Actions runs `bash -e {0}` without it
          # and the status of `script | tee` would otherwise be tee's.
          set -o pipefail
          bash scripts/sync-gitlinks.sh 2>&1 | tee /tmp/sync-pins.log

      - name: Splice the generated R0 dispatcher (opt-in)
        # The marketplace corpus is the single source of the generated dispatcher
        # table. This step is a NO-OP while AGENTS.md keeps its hand-curated table
        # outside the generated markers; it splices the fragment only once AGENTS.md
        # carries `BEGIN/END GENERATED SKILL DISPATCHER` AND the pinned marketplace
        # ships `DISPATCHER.md`. (Both are needed — see scripts/sync-dispatcher.sh.)
        run: bash scripts/sync-dispatcher.sh

      - name: Verify policy B
        # A REAL gate that runs here, so the body pastes its output instead of asserting
        # a pin is correct. `scripts/check-policy-b.sh` reads charly's own gitlinks with
        # `git ls-tree` (tree objects — present in a shallow clone; charly's NESTED
        # submodules need not be initialised) and asserts every umbrella `distro-*`
        # gitlink equals it. That is exactly the assertion this PR can violate, and it
        # costs milliseconds. `tee` so the body can paste it verbatim.
        run: |
          set -o pipefail
          bash scripts/check-policy-b.sh 2>&1 | tee /tmp/policy-b.log

      - name: Nothing to sync?
        id: dirty
        # Compare against HEAD, not the index. `git diff` alone diffs the WORKTREE
        # against the INDEX, and scripts/sync-gitlinks.sh `git add`s every gitlink it
        # bumps — so a sync that changed something left nothing UNSTAGED and this gate
        # read changed=false every time. The workflow therefore ran green and opened no
        # PR while pins drifted, which is why every landed sync has been hand-made.
        # `git diff --quiet HEAD` sees staged and unstaged alike.
        run: |
          if git diff --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if a sync PR is already open
        id: skip
        if: steps.dirty.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh pr list --search 'chore: sync gitlinks in:title' --state open --json number --jq 'length')
          if [ "$OPEN" -gt 0 ]; then
            echo "sync PR already open — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # `scripts/verify-pins.sh` is deliberately NOT run here, and the body no longer claims
      # it is. It was tried, and it fails in this environment for a reason that makes running
      # it here pointless rather than fixable:
      #
      #   FAIL: charly nested submodules not at their gitlinks
      #
      # That check is `git -C charly submodule status --recursive | grep '^[+-]'`, and `-`
      # means UNINITIALISED. `actions/checkout` uses `submodules: true` (non-recursive), so
      # charly's nested submodules never exist here and the check can only fail — while
      # initialising them would check each out AT its gitlink, making the check pass by
      # construction and assert nothing. It is a gate for a human's local tree, where the
      # nested state can genuinely have drifted; it is vacuous on a fresh clone.
      #
      # So the body pastes what IS real evidence in CI: the producer's own resolution, repo
      # by repo, from /tmp/sync-pins.log.

      # The default GITHUB_TOKEN CANNOT open a pull request: GitHub refuses it with
      # "GitHub Actions is not permitted to create or approve pull requests" unless the
      # org/repo toggle `can_approve_pull_request_reviews` is on — and that toggle also
      # lets any workflow APPROVE pull requests, which against this org's auto-merge-on-PASS
      # flow is a review-bypass surface. marketplace's refresh.yml says so in as many words:
      # "Do NOT 'fix' it by enabling can_approve_pull_request_reviews".
      #
      # So mint a short-lived GitHub App token instead, exactly as refresh.yml already does —
      # same SHA-pinned action, same org secrets, same fallback.
      - name: Create bot token (GitHub App)
        id: bot-token-app
        if: steps.dirty.outputs.changed == 'true' && steps.skip.outputs.skip == 'false'
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.CHARLY_AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.CHARLY_AUTO_MERGE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Use fallback bot token
        id: bot-token-pat
        if: steps.dirty.outputs.changed == 'true' && steps.skip.outputs.skip == 'false'
        run: echo "token=${{ secrets.CHARLY_BOT_TOKEN }}" >> "$GITHUB_OUTPUT"

      - name: Require a bot token
        if: steps.dirty.outputs.changed == 'true' && steps.skip.outputs.skip == 'false'
        env:
          APP_TOKEN: ${{ steps.bot-token-app.outputs.token }}
          ALT_TOKEN: ${{ steps.bot-token-pat.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ] && [ -z "$ALT_TOKEN" ]; then
            echo "::error::No bot token configured: set org secrets CHARLY_AUTO_MERGE_APP_ID + CHARLY_AUTO_MERGE_PRIVATE_KEY (GitHub App), or CHARLY_BOT_TOKEN."
            exit 2
          fi

      - name: Open sync PR
        if: steps.dirty.outputs.changed == 'true' && steps.skip.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.bot-token-app.outputs.token || steps.bot-token-pat.outputs.token }}
        run: |
          # Capture the moved gitlinks BEFORE committing — the body must name every one of
          # them. A one-line body cannot pass rule A1 ("every diff item accounted for"), and
          # a sync that moves 79 submodules is exactly where a count says nothing: that is
          # what BLOCKED the first PR this workflow ever managed to open.
          # `git add -A` is kept even though sync-gitlinks.sh already stages each bumped
          # gitlink: dropping it would silently narrow what the sync commits to whatever the
          # script happened to stage. Capture AFTER it, so the list is what actually commits.
          git add -A
          MOVED=$(git diff --cached --name-only)
          COUNT=$(printf '%s\n' "$MOVED" | grep -c . || echo 0)

          # Bounds for the 65536-char PR-body cap. The full lists go to the
          # `sync-evidence` artifact (uploaded in the next step), so the body carries a
          # bounded, representative slice plus the TRUE count.
          SYNC_PATH_LIST_MAX="${SYNC_PATH_LIST_MAX:-200}"
          PRODUCER_MAX="${PRODUCER_MAX:-200}"
          MOVED_HEAD=$(printf '%s\n' "$MOVED" | head -n "$SYNC_PATH_LIST_MAX")
          if [ "$COUNT" -gt "$SYNC_PATH_LIST_MAX" ]; then
            COUNT_HINT=" (first ${SYNC_PATH_LIST_MAX} of ${COUNT}; full list in the artifact)"
          else
            COUNT_HINT=""
          fi
          # Full evidence for the artifact, in ONE network pass (the script runs once for
          # the body below; the artifact does NOT re-resolve every pin). The artifact
          # carries the two things that together name every moved pin completely: the full
          # path list, and the producer's own resolution (its log has one "  <path> ->
          # <sha>" line per pin), plus the policy-B gate log. The body's bounded per-pin
          # table is a representative slice for the 65536-char cap.
          {
            echo "== moved paths (${COUNT}) =="
            printf '%s\n' "$MOVED"
            echo
            echo "== producer resolution (full) =="
            grep -E '^  .+ -> ' /tmp/sync-pins.log || true
            echo
            echo "== policy B gate output =="
            cat /tmp/policy-b.log
          } > /tmp/sync-evidence.txt

          {
            echo "## Summary"
            echo
            echo "Automated gitlink sync: every umbrella submodule pin advanced to what **policy B**"
            echo "requires — \`charly\` to its own default-branch HEAD, \`distro-*\` to exactly the commits"
            echo "charly's own gitlinks pin, everything else to its own default branch."
            echo
            echo "**${COUNT}** gitlink(s) moved."
            echo
            # GITHUB BODY CAP: the PR body is capped at 65536 chars. A sync that moves
            # hundreds of pins (measured: 393 after the org-wide ruleset cutover) overflows
            # it and `gh pr create` fails "Body is too long". The "Every changed path, named"
            # list below is bounded (first SYNC_PATH_LIST_MAX paths + a count); the per-pin
            # evidence section inside sync-pin-evidence.sh is byte-bounded too; the FULL
            # path list + evidence are uploaded as the `sync-evidence` run artifact. The
            # summary COUNT always names the true total, so accounting stays complete.
            echo "The full path list and per-pin evidence are in the \`sync-evidence\` run artifact"
            echo "(downloadable from this run's Actions page)."
            echo
            echo "## Every changed path, named${COUNT_HINT}"
            echo
            echo '```'
            printf '%s\n' "$MOVED_HEAD"
            echo '```'
            echo
            echo "Each entry is a **submodule pointer**, not file content: the umbrella records which"
            echo "commit of each repo the snapshot means. The content behind every one of them was"
            echo "reviewed and gated by that repo's own \`pr-validator\` before it was tagged. This PR"
            echo "cannot review it and does not restate it."
            echo
            echo "## How tested"
            echo
            echo "**What produced this diff**, pasted from the run that opened this PR — the producer's"
            echo "own resolution for the moved pins (bounded to the first ${PRODUCER_MAX} for length;"
            echo "the full log is the \`sync-evidence\` artifact):"
            echo
            echo '```'
            # Filter the producer log to the moved paths, bounded. The log line per pin is
            # "  <path> -> <shortsha>"; match the exact fixed string "  <path> -> " so a
            # prefix repo cannot match a longer sibling (e.g. plugin-vm vs plugin-vmx).
            # Every moved path appears in the FULL artifact; this body slice is capped.
            printf '%s\n' "$MOVED" | head -n "$PRODUCER_MAX" | while IFS= read -r p; do
              [ -n "$p" ] || continue
              grep -m1 -F "  ${p} -> " /tmp/sync-pins.log \
                || echo "  ${p} -> (MISSING from producer log — investigate)"
            done
            [ "$COUNT" -gt "$PRODUCER_MAX" ] && echo "  … and $((COUNT - PRODUCER_MAX)) more (full list in the sync-evidence artifact)"
            echo '```'
            echo
            # The default-branch assertion, PER MOVED PIN. `sync-gitlinks.sh` pins `charly`
            # and every non-`distro-*` repo at its own default-branch HEAD, and `distro-*` at
            # exactly charly's own gitlink. Paste, for each moved path, the staged submodule
            # SHA beside the owning repo's REMOTE default-branch HEAD (`git ls-remote <url>
            # HEAD`). A PR-branch pin would be visibly unequal; `distro-*` are EXPECTED unequal
            # here (they track charly, not their own HEAD) and are proven by policy B instead.
            # The pin-evidence section (per-pin staged-gitlink vs remote default-branch
            # HEAD, and the truthful policy-B coverage framing) lives in a TESTABLE,
            # committed script — `scripts/sync-pin-evidence.sh` — whose `--self-test`
            # the pre-commit gate runs, so this logic has in-tree coverage.
            printf '%s\n' "$MOVED" | bash scripts/sync-pin-evidence.sh "$PWD" /tmp/policy-b.log
            echo
            echo "## Change classification"
            echo
            echo "- **Change class:** gitlink-only. No file content, no workflow, no script, no Go."
            echo "- **Breaking change + rollback:** none — a revert restores the previous snapshot."
            echo
            echo "## Harness rulebook compliance"
            echo
            echo "- **R0 skills:** the sync is owned by \`/charly-internals:git-workflow\`; this PR is"
            echo "  produced by the workflow that skill describes."
            echo "- **R1 RCA + zero warnings:** the producer resolves each pin and names any repo it"
            echo "  cannot resolve rather than guessing; no warning appears in the pasted output."
            echo "- **R2 no parking:** a defect found in THIS workflow is fixed here; content behind a"
            echo "  moved gitlink belongs to its OWNING repo (which gated it before tagging)."
            echo "- **R3 no duplication:** policy B is asserted by \`scripts/check-policy-b.sh\` — the ONE"
            echo "  implementation \`verify-pins.sh\` also calls."
            echo "- **R4 no workaround:** \`charly\` and every non-\`distro-*\` pin is its owning repo's"
            echo "  default-branch HEAD (per-pin \`git ls-remote\` above); every \`distro-*\` pin is charly's"
            echo "  own gitlink. The producer never pins a PR branch."
            echo "- **R5 hard cutover + grep:** the pointers are replaced, not appended to."
            echo "- **R6 git safety:** a fresh branch per run; no force-push; no push to \`main\`."
            echo "- **R7 runtime gate:** the coverage for the moved pins is the per-pin"
            echo "  \`git ls-remote\` default-branch evidence above; \`distro-*\` pins (when any move) are"
            echo "  additionally asserted by policy B."
            echo "- **R8 artifact invariants:** \`N/A — no generated artifact/OCI label.\`"
            echo "- **R9 binary == source:** \`N/A — no binary is built by this workflow.\`"
            echo "- **R10 disposable + coverage:** the coverage is the per-pin \`git ls-remote\`"
            echo "  default-branch evidence above (it fails if a pin is a PR branch or a non-HEAD"
            echo "  commit); policy B additionally gates any moved \`distro-*\` pin."
            echo "- **RDD / ADE / SDD:** RDD — the producer resolves refs from the real repos, not from"
            echo "  a doc. ADE — no candy. SDD — \`N/A\`, no schema/generated-code change."
            echo "- **Hard cutover:** one atomic commit; no deferred work in scope."
            echo "- **Disposable-only autonomy:** \`N/A — no destroy/rebuild.\`"
            echo
            echo "---"
            echo
            echo "## Attribution"
            echo
            echo "This body is emitted by the fixed, model-free \`printf/echo\` block in"
            echo "\`.github/workflows/sync.yml\` (visible in this workflow's committed source). The"
            echo "runtime identity is the GitHub Actions runner itself."
            echo
            echo "*Assisted-by: GitHub Actions ubuntu-latest (fully tested and validated)*"
          } > /tmp/sync-body.md

          # HARD GUARD: GitHub rejects a body over 65536 chars. Fail LOUD here (naming the
          # size) rather than at `gh pr create` with an opaque GraphQL error, and never let a
          # future unbounded section silently regress this.
          BODY_BYTES=$(wc -c < /tmp/sync-body.md)
          if [ "$BODY_BYTES" -gt 65536 ]; then
            echo "::error::sync PR body is ${BODY_BYTES} bytes (> 65536 GitHub cap) — bound the section that grew"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "sync/$(date -u +%Y%m%d-%H%M%S)"
          git commit -m "chore: sync gitlinks"
          git push -u origin HEAD
          gh label create auto-merge --force 2>/dev/null || true
          gh pr create --title "chore: sync gitlinks" \
            --body-file /tmp/sync-body.md \
            --label auto-merge

      - name: Upload the full sync evidence
        # The body is byte-bounded for the 65536-char cap, so the FULL moved-path list and
        # per-pin evidence ride here instead — the PR body links to this artifact, so no
        # evidence is dropped, only relocated.
        if: steps.dirty.outputs.changed == 'true' && steps.skip.outputs.skip == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sync-evidence
          path: /tmp/sync-evidence.txt
          if-no-files-found: warn
